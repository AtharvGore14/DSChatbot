<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Map of main pages</title>
  <desc id="pdesc">Public pages on the left; login-gated pages grouped on the right.</desc>
  <rect width="880" height="320" fill="#0f0f1a" rx="16"/>
  <text x="440" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600">Where to click in the app</text>
  <text x="440" y="56" text-anchor="middle" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="11">No login vs login required</text>

  <rect x="32" y="78" width="380" height="220" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5" rx="12"/>
  <text x="222" y="108" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600">Open to everyone</text>
  <text x="48" y="138" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/  Home</text>
  <text x="48" y="162" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/register  ·  /login</text>
  <text x="48" y="186" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/search  ·  /demo</text>
  <text x="48" y="210" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/chatbot  ·  /about</text>
  <text x="48" y="242" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="10">Try Demo + Chatbot before creating an account.</text>

  <rect x="468" y="78" width="380" height="220" fill="#1a1a2e" stroke="#f59e0b" stroke-opacity="0.6" rx="12"/>
  <text x="658" y="108" text-anchor="middle" fill="#fcd34d" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600">After you sign in</text>
  <text x="484" y="138" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/dashboard</text>
  <text x="484" y="162" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/analysis  (+ PDF export)</text>
  <text x="484" y="186" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/compare  ·  /optimizer</text>
  <text x="484" y="210" fill="#e2e8f0" font-family="monospace,Consolas,sans-serif" font-size="11">/admin</text>
  <text x="484" y="242" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="10">Session cookie remembers you until logout.</text>

  <path d="M 420 188 L 452 188" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>
</svg>
